name: c_corner_solid_state
title: "C - four corner solid-state lidars"
rationale: >
  No moving parts and four viewpoints spread to the corners of the upperframe,
  which is the widest baseline the machine offers and the only layout here whose
  sensors are not all clustered around the cab.  Each unit sees 70 degrees, so
  the four windows have to be aimed to overlap; where they do not, the gap is a
  persistent one that no amount of articulation will close.
calibration_notes: >
  Four fixed extrinsics, all on the same casting.  More units than A but the
  same kind of calibration problem, solved four times.
mounts:
  - {sensor: solid_state, link: turret, xyz: [1.84, 1.52, 1.40],   yaw: 40.0,   pitch: 22.0, label: "front left"}
  - {sensor: solid_state, link: turret, xyz: [1.84, -1.52, 1.40],  yaw: -40.0,  pitch: 22.0, label: "front right"}
  - {sensor: solid_state, link: turret, xyz: [-2.97, 1.44, 1.10],  yaw: 140.0,  pitch: 22.0, label: "rear left"}
  - {sensor: solid_state, link: turret, xyz: [-2.97, -1.44, 1.10], yaw: -140.0, pitch: 22.0, label: "rear right"}
