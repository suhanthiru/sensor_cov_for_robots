name: c_corner_solid_state
title: "C - four corner solid-state lidars"
rationale: >
  No moving parts and four viewpoints spread to the corners of the upperframe,
  which is the widest baseline the machine offers and the only layout here whose
  sensors are not all clustered around the cab.

  Four windows of 70 degrees cannot cover 360, so 80 degrees of azimuth has to
  be given up somewhere and the aiming is a real design decision rather than a
  detail.  The front pair are turned inward to 32 degrees so their windows meet
  on the centreline with a few degrees to spare, and the rear pair likewise, so
  the gaps fall on the two flanks instead of straight ahead.  Aimed at the
  corners instead, the gap lands on the centreline directly in front of the
  machine, which is where the work is; that arrangement scored 37 percent
  coverage with no overlap anywhere and no dual coverage at all.
calibration_notes: >
  Four fixed extrinsics, all on the same casting.  More units than A but the
  same kind of calibration problem, solved four times.
mounts:
  - {sensor: solid_state, link: turret, xyz: [1.84, 1.52, 1.40],   yaw: 32.0,   pitch: 22.0, label: "front left"}
  - {sensor: solid_state, link: turret, xyz: [1.84, -1.52, 1.40],  yaw: -32.0,  pitch: 22.0, label: "front right"}
  - {sensor: solid_state, link: turret, xyz: [-2.97, 1.44, 1.10],  yaw: 148.0,  pitch: 22.0, label: "rear left"}
  - {sensor: solid_state, link: turret, xyz: [-2.97, -1.44, 1.10], yaw: -148.0, pitch: 22.0, label: "rear right"}
