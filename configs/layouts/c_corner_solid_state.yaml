name: c_corner_solid_state
title: "C - four corner solid-state lidars"
rationale: >
  No moving parts and four viewpoints spread to the corners of the upperframe,
  which is the widest baseline the machine offers and the only layout here whose
  sensors are not all clustered around the cab.

  The aiming is the whole design, and it cannot be made to work.  Four windows
  of 70 degrees total 280, so at least 80 degrees of azimuth is uncovered
  before anything else is considered, and the corners make it worse: a unit
  1.5 m off the centreline sees a narrower span of machine-frame bearing than
  its own field of view, because near bearings subtend more angle at an offset
  viewpoint.  Aimed outward along the diagonals the gap lands dead ahead, which
  is where the work is; that arrangement left 45 percent of bearings uncovered.
  Aiming each unit at the cardinal direction its corner is nearest to, with a
  shallower 15 degree tilt so the horizontal window is not spent on the ground
  close in, brings that to 38 percent and puts the four remaining gaps on the
  diagonals.

  That is the best this arrangement does, and it is the finding rather than a
  detail of the setup: no aiming of four 70 degree windows gives this machine
  redundancy anywhere at all.  Dual coverage is zero under every variant tried,
  because any overlap has to be bought from a total window that is already 80
  degrees short of the circle.
calibration_notes: >
  Four fixed extrinsics, all on the same casting.  More units than A but the
  same kind of calibration problem, solved four times.
mounts:
  - {sensor: solid_state, link: turret, xyz: [1.84, 1.52, 1.40],   yaw: 0.0,   pitch: 15.0, label: "front left"}
  - {sensor: solid_state, link: turret, xyz: [1.84, -1.52, 1.40],  yaw: -90.0, pitch: 15.0, label: "front right"}
  - {sensor: solid_state, link: turret, xyz: [-2.97, 1.44, 1.10],  yaw: 90.0,  pitch: 15.0, label: "rear left"}
  - {sensor: solid_state, link: turret, xyz: [-2.97, -1.44, 1.10], yaw: 180.0, pitch: 15.0, label: "rear right"}
