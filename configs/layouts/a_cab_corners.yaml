name: a_cab_corners
title: "A - two spinning lidars at the cab front corners"
rationale: >
  The cheapest arrangement that still gives two viewpoints.  Both units sit on
  the front face of the operator cab, which on an excavator is offset to the
  left of centreline and sits hard against the boom: the cab's right face is at
  y = 0.32 m and the boom's left face at y = 0.31 m.  There is no room to put a
  sensor outboard of the cab on the boom side, so the whole baseline is 0.8 m
  wide and lives entirely on the left of the machine.  That is not an oversight
  in the layout; it is what "cab front corners" physically means on this
  machine, and the study is here to price it.
calibration_notes: >
  Two fixed extrinsics on one rigid casting.  Calibrate once at build, and the
  only thing that moves them afterwards is a collision.
mounts:
  - {sensor: spinning32, link: turret, xyz: [1.80, 1.30, 1.95], label: "cab front left"}
  - {sensor: spinning32, link: turret, xyz: [1.80, 0.50, 1.95], label: "cab front right"}
